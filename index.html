<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <header>
        <div class="container">
            <div class="header_wrapper">
                <div class="logo">
                    <img src="./assets/images/logo.svg" alt="logo">
                </div>

                <div class="menu_wrapper">
                    <ul class="menu">
                        <li><a href="">Home</a></li>
                        <li><a href="">Episodes</a></li>
                        <li><a href="">About</a></li>
                        <li><a href="">Contact</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <section class="main_section">
        <div class="container">
            <div class="main_wrapper">
                <div class="main_img_wrapper">
                    <img class="main_img" src="./assets/images/main-image.webp" alt="">
                </div>

                <div class="main_preview_wrapper">
                    <h1 class="title">Take your podcast to the next <span class="bold_title_word">level</span></h1>
                    <span class="subtitle">Listen on</span>
                    <div class="players_wrapper">
                        <ul class="link_list">
                            <li class="link_item"><a href=""><img src="./assets/images/icon-1.svg" alt=""></a></li>
                            <li class="link_item"><a href=""><img src="./assets/images/icon-2.svg" alt=""></a></li>
                            <li class="link_item"><a href=""><img src="./assets/images/icon-3.svg" alt=""></a></li>
                            <li class="link_item"><a href=""><img src="./assets/images/icon-4.svg" alt=""></a></li>
                            <li class="link_item"><a href=""><img src="./assets/images/icon-5.svg" alt=""></a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </section>


</body>
</html>
